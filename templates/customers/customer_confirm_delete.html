{% extends "base.html" %}
{% block title %}Delete Customer{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold mb-6">Delete Customer</h1>
    <p>Are you sure you want to delete customer "{{ customer.name }}"?</p>
    <form method="POST" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="bg-red-600 text-white px-6 py-3 rounded hover:bg-red-700">Yes, Delete</button>
        <a href="{% url 'customers:customer_list' %}" class="ml-4 text-gray-600 hover:text-gray-900">Cancel</a>
    </form>
</div>
{% endblock %}
